<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle with Deep Shadow -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" fill="none" />

  <!-- Pip / Tutor Icon Motif: Mortarboard + AI Pulse Spark -->
  <!-- Cap Rhombus -->
  <polygon points="32,16 52,25 32,34 12,25" fill="url(#capGrad)" />
  
  <!-- Cap Underbelly Skullcap -->
  <path d="M20,28.8 L20,38 C20,43 44,43 44,38 L44,28.8 C39.5,31.2 24.5,31.2 20,28.8 Z" fill="rgba(255, 255, 255, 0.85)" />

  <!-- Tassel Cord & Bead -->
  <path d="M47,27.5 L50,33 L49,42" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="49" cy="42" r="2.2" fill="#38bdf8" />

  <!-- Glowing Pip Sparkle in Center -->
  <path d="M32,44 L33.5,47.5 L37,49 L33.5,50.5 L32,54 L30.5,50.5 L27,49 L30.5,47.5 Z" fill="#38bdf8" />
</svg>
